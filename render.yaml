services:
  - type: static
    name: harold-terminal
    runtime: static
    branch: main
    plan: free
    staticPublishPath: ./publish
    autoDeployTrigger: commit
    envVars:
      - key: API_BASE
        value: https://lubuntu.tail239f3d.ts.net/v1
      - key: API_KEY
        value: [REDACTED]
    routes:
      - type: rewrite
        source: /*
        destination: /index.html